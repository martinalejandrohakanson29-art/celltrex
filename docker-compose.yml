version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: celltrex_postgres
    restart: always
    environment:
      POSTGRES_DB: celltrex
      POSTGRES_USER: celltrex_user
      POSTGRES_PASSWORD: celltrex_secure_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - celltrex_network

  app:
    build: .
    container_name: celltrex_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://celltrex_user:celltrex_secure_password@postgres:5432/celltrex
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - postgres
    networks:
      - celltrex_network

volumes:
  pgdata:
  uploads_data:

networks:
  celltrex_network:
    driver: bridge
